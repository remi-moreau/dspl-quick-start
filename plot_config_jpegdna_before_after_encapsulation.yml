scripts: # BEHAVIOR: Comment any script you do not want to run (no plot-level yes/no plotting switch)
  - read_pool_stats:
      script_settings:
      plot_settings:
        - ref-coverage-in-read-pool_distribution:
            same_x_scale_across_inputs: true
            same_y_scale_across_inputs: true
            title: "Reference count distribution over normalized read-pool coverage"
            description: >-
                For input i, let r_ij be the raw read count of selected reference j, including zero-count references, let N_i be the number of selected references, and let mu_i=(sum_j r_ij)/N_i. The displayed X coverage is x_ij=r_ij/mu_i. All inputs use bins with the same edges, starting at zero, with common normalized width Delta_x=R/mu_pooled, where R is read_count_values_per_bin and mu_pooled=(sum_i sum_j r_ij)/(sum_i N_i), the mean raw coverage pooled over references and therefore weighted by each input's selected-reference count. Following NumPy histogram semantics, bins are left-closed and right-open, [b*Delta_x,(b+1)*Delta_x), except the final bin, which includes its right edge; the common final edge is strictly greater than max_i,j(x_ij), so this final closure cannot affect assignment. Consequently, one bin corresponds to R*mu_i/mu_pooled raw reads in input i; R is exact only for an input whose mean equals mu_pooled. For item k in input i, each bar height is n_ikb/N_ik, where n_ikb is the number of that item's references in bin b and N_ik is that item's total selected-reference count, so the heights sum to one for every non-empty item. All panels display the full common X range; common Y scaling only supports comparison of these item-wise fractions.
            read_count_values_per_bin: 500
            bin_width_mode: shared_normalized
            bin_width_reference: pooled
        # - ref-coverage-in-read-pool_vs_delta-g_scatter:
        #     same_x_scale_across_inputs: true
        #     same_y_scale_across_inputs: true
        #     title: "Normalized read-pool coverage against delta G"
        #     description: "Points are colored by item, while linear regression and Spearman statistics are computed globally across every selected reference with delta G."
        #     display_linear_regression: true
        # - ref-coverage-in-read-pool_vs_delta-g_mean-in-bin:
        #     same_x_scale_across_inputs: true
        #     same_y_scale_across_inputs: true
        #     title: "Binned mean normalized read-pool coverage over delta G intervals"
        #     description: "Items are ignored during aggregation; each bar reports the global mean normalized coverage for a delta G bin passing the minimum point threshold."
