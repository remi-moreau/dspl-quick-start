exp_id: six_images

exp_description: >
  Encoding and decoding of six images of the JPEG AIC 3 dataset, 
  using JPEGDNA as the outer coding protocol. 

database: /run/media/remi-moreau/WORKDISKRM/2026_stage-recherche_cnrs-i3s_dna-data-storage/1_data-archive_do-not-access-nor-delete_copy-only/2026-07_wetlab_progressive-decoding/dspl-db/barcode04_six_images.db

decoding_settings:
  ref_enc_run_id: full_encoding_11

  run_name: decoding # pipelinesys will automatically provide an unused positive integer run_number n, such that the dec_run_id will be run_name+"_"+run_number

  loop: -1

  labels:
    - barcode04_six_images_alignment_decoding
  
  output_data_root: output_data/six_images/decoding

  input_settings:
    name: read_folder
    read_folder_path: /run/media/remi-moreau/WORKDISKRM/2026_stage-recherche_cnrs-i3s_dna-data-storage/1_data-archive_do-not-access-nor-delete_copy-only/2026-07_wetlab_progressive-decoding/reads/all_reads/all_reads/barcode04_six-images 
    move_reads_to: /run/media/remi-moreau/WORKDISKRM/2026_stage-recherche_cnrs-i3s_dna-data-storage/1_data-archive_do-not-access-nor-delete_copy-only/2026-07_wetlab_progressive-decoding/reads/all_reads/all_reads/barcode04_six-images_processed
    database_ingestion_settings:
      read_pool_id: barcode04_six_images
      read_pool_description: >
        Reads of the progressive decoding 
        wetlab of july 2026.
      simulation: false
      aligner: minimap2
      force: false
      dspl_root: .
      time_between_fastq: 60 # In seconds

  multi_pass_settings:
    name: MULTI_PASS # Replace with "SINGLE_PASS" to have single pass behavior
    watch: false
    granular: false
    time_limit: inf
    pass_limit: inf
    n_files_per_pass: 10
    read_batch_size: 20000      
    early_stop_settings:
      name: PSNR
      threshold: 35

  default_inner_decoding_settings:
    preprocessing_settings:
      name: ALIGNMENT
    clustering_settings:
      name: ALIGNMENT
    consensus_settings: 
      name: VOTE_LOGITS_CONSENSUS
      mode: QUAL_VOTE
      read_filtering_mode: EXACT_LENGTH

  default_outer_decoding_settings:
    name: JPEGDNA
    ext_header_rs_bytes: 17
    ext_main_section_rs_bytes: 6
    jpegdna_python_executable: /home/remi-moreau/miniconda3/envs/jpegdna_vm_py311/bin/python

  items:
    - 2:
        name: Burger
        skip: true

    
