  - 1:
      name: Agilent sureprint
      database: database/barcode01_agilent.db
      exp_id: synthesis_bench
      read_pool_id: barcode01_agilent
      items:
        - 0:
            name: JPEGDNA-control
        - 1:
            name: JPEGDNA-DeltaG
      decoding_run_label: barcode01_agilent_alignment_decoding
