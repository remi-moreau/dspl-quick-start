exp_id: synthesis_bench

exp_description: |
  Encoding and decoding of three copies of the same image (the bird, i.e. image 5, of the JPEG AIC-3 dataset).
   · The first copy is the one of reference, it uses JPEGDNA classical encoding;
   · The second copy is encoded using JPEGDNA but with free energy constraints, to see their effect on decoding;
   · The third copy is encoded using motif PAIRCODE.

database: database/barcode01_agilent.db

decoding_settings:
  ref_enc_run_id: full_encoding_15

  run_name: decoding

  loop: 3

  output_data_root: output_data/synthesis_bench/decoding

  input_settings:
    name: read_folder
    read_folder_path: /home/remi-moreau/Documents/3_STAGE_RECHERCHE/5_DATA/2026-06_wetlab_real-time-decoding/all_reads/barcode01_agilent/barcode01_agilent_part_1
    move_reads_to: /home/remi-moreau/Documents/3_STAGE_RECHERCHE/5_DATA/2026-06_wetlab_real-time-decoding/all_reads/barcode01_agilent/barcode01_agilent_part_1_processed
    # IMPORTANT: you MUST add the move_reads_to parameter if you 
    # want to realize a multi run decoding (loop >= 2). Otherwise,
    # the same reads will be decoded again and again because dspl
    # do not keep memory of which fastqs were processed between 
    # the runs.
    database_ingestion_settings:
      read_pool_id: barcode01_agilent
      read_pool_description: >
        Wetlab reads for synthesis bench progressive 
        decoding wetlab (july 2026)
      simulation: false
      aligner: minimap2
      force: false
      dspl_root: .
      time_between_fastq: 60 # In seconds

  multi_pass_settings:
    name: MULTI_PASS # Replace with "SINGLE_PASS" to have single pass behavior (you must also set watch to false in that case)
    watch: false
    granular: false
    time_limit: inf
    pass_limit: inf
    read_batch_size: 2500    
    early_stop_settings:
      name: PSNR
      threshold: 35 

  default_inner_decoding_settings:
    preprocessing_settings:
      name: ALIGNMENT
    clustering_settings:
      name: ALIGNMENT
    consensus_settings: 
      name: VOTE_LOGITS_CONSENSUS
      mode: QUAL_VOTE
      read_filtering_mode: EXACT_LENGTH

  default_outer_decoding_settings:
    name: JPEGDNA
    ext_header_rs_bytes: 17
    ext_main_section_rs_bytes: 6
    jpegdna_python_executable: /home/remi-moreau/miniconda3/envs/jpegdna_vm_py311/bin/python

  items:
    - 2:
        name: Bird_MOTIF_PAIRCODE
        skip: true
        outer_decoding_settings:
          name: MOTIF_PAIRCODE
          motif_python_executable: /home/remi-moreau/miniconda3/envs/jpegdna_vm_py311/bin/python
